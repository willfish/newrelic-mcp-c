name: Release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ inputs.version || github.ref }}
      - name: Build, test and package natively
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          grep -F "version=\${NEWRELIC_MCP_VERSION:-$VERSION}" install
          sh packaging/build-macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-darwin-${{ matrix.arch }}
          path: dist/*-darwin-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cp install dist/install
          cd dist
          sha256sum -- *.tar.gz install > SHA256SUMS
          gh release create "$VERSION" --verify-tag --draft --title "$VERSION" \
            --notes 'macOS 14+ binaries for Intel and Apple Silicon. Ad-hoc signed, not notarised. See the README for installation.' \
            ./*.tar.gz install SHA256SUMS
          gh release edit "$VERSION" --draft=false --latest
  verify-install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install from the public release
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          curl -fsSL "https://github.com/willfish/newrelic-mcp-c/releases/download/$VERSION/install" | sh
          test "$("$HOME/.local/bin/newrelic-mcp-c" --version)" = "newrelic-mcp-c ${VERSION#v}"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | "$HOME/.local/bin/newrelic-mcp-c" | grep -q run_nrql_query
